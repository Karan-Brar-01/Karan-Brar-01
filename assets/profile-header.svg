  <rect width="1200" height="330" rx="28" fill="url(#glow)"/>
  <path d="M840 251C895 192 939 225 980 156S1067 77 1160 112" fill="none" stroke="#baf86b" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M840 269C901 223 960 258 1009 203s83-66 151-55" fill="none" stroke="#70e5c1" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="980" cy="156" r="5" fill="#baf86b" filter="url(#softGlow)"/>
  <circle cx="1009" cy="203" r="4" fill="#70e5c1" filter="url(#softGlow)"/>

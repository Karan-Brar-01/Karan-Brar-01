<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">Karan Brar</title>
  <desc id="description">Data Science, machine learning, and full-stack engineering</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08100e"/>
      <stop offset="0.55" stop-color="#0d1b16"/>
      <stop offset="1" stop-color="#16261f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.78">
      <stop offset="0" stop-color="#baf86b" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#baf86b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#d5eee1" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#background)"/>
